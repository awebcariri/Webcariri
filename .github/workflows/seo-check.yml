name: Verificação do site e SEO
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:seo
