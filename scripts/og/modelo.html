<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Modelo dos banners de compartilhamento (1200x630). Usado por scripts/og/gerar.mjs. -->
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('../../public/fonts/bricolage-grotesque.woff2') format('woff2');
        font-weight: 200 800;
        font-stretch: 75% 100%;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('../../public/fonts/dm-sans.woff2') format('woff2');
        font-weight: 100 1000;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('../../public/fonts/fraunces-italic.woff2') format('woff2');
        font-style: italic;
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'DM Mono';
        src: url('../../public/fonts/dmmono-400.woff2') format('woff2');
      }
      :root {
        --creme: #f3efe5;
        --tomate: #eb3e20;
        --amarelo: #f6d95b;
        --vinho: #651b26;
        --preto: #171511;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: var(--creme);
        font-family: 'DM Sans', sans-serif;
        color: var(--preto);
      }
      /* moldura fina, como as linhas do site */
      .moldura {
        position: absolute;
        inset: 26px;
        border: 1.5px solid rgba(101, 27, 38, 0.28);
        border-radius: 18px;
      }
      .texto {
        position: absolute;
        left: 64px;
        top: 58px;
        bottom: 58px;
        width: 560px;
        display: flex;
        flex-direction: column;
        z-index: 3;
      }
      .logo {
        width: 230px;
      }
      .rotulo {
        margin-top: auto;
        font-family: 'DM Mono', monospace;
        font-size: 17px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--preto);
      }
      h1 {
        margin-top: 14px;
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 800;
        color: var(--vinho);
        font-size: 84px;
        line-height: 0.9;
        letter-spacing: -0.05em;
      }
      h1 em {
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-weight: 750;
        color: var(--tomate);
        letter-spacing: -0.045em;
      }
      .sub {
        margin-top: 18px;
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.02em;
        color: var(--vinho);
      }
      .rodape {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 21px;
        font-weight: 600;
        color: var(--vinho);
      }
      .rodape .ponto {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--tomate);
      }
      .chips {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .chip {
        white-space: nowrap;
        padding: 9px 16px;
        border-radius: 999px;
        background: #fffaf0;
        border: 1.5px solid rgba(101, 27, 38, 0.3);
        font-size: 19px;
        font-weight: 600;
        color: var(--vinho);
      }
      .chip b {
        color: var(--tomate);
      }

      /* lado direito */
      .arte {
        position: absolute;
        right: 26px;
        top: 26px;
        bottom: 26px;
        width: 520px;
        overflow: hidden;
        border-radius: 0 18px 18px 0;
      }
      .papel {
        position: absolute;
        background: var(--amarelo);
        border-radius: 4px;
      }
      .papel.p1 {
        left: 40px;
        top: 70px;
        width: 400px;
        height: 330px;
        transform: rotate(-3deg);
      }
      .papel.p2 {
        left: 120px;
        top: 40px;
        width: 360px;
        height: 250px;
        transform: rotate(2.5deg);
        opacity: 0.85;
      }
      .tela {
        position: absolute;
        left: 70px;
        top: 86px;
        width: 430px;
        border-radius: 10px;
        overflow: hidden;
        background: #f6f4f1;
        padding-top: 22px;
        box-shadow: 0 22px 40px -20px rgba(60, 20, 20, 0.55), 0 0 0 1px rgba(23, 21, 17, 0.12);
      }
      .tela::before {
        content: '';
        position: absolute;
        top: 8px;
        left: 11px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ee6a5f;
        box-shadow: 11px 0 0 #f5bf4f, 22px 0 0 #61c454;
      }
      .tela img {
        display: block;
        width: 100%;
        aspect-ratio: var(--recorte, 1.5);
        object-fit: cover;
        object-position: top;
      }
      .cari {
        position: absolute;
        z-index: 2;
      }
      .balao {
        position: absolute;
        z-index: 2;
        font-family: 'Bricolage Grotesque', sans-serif;
        font-stretch: 75%;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 19px;
        line-height: 1.1;
        letter-spacing: 0.02em;
        background: var(--amarelo);
        padding: 14px 18px;
        border-radius: 12px 18px 12px 16px;
        box-shadow: 0 0 0 5px #fffaf0, 0 10px 22px -10px rgba(60, 20, 20, 0.45);
        transform: rotate(-7deg);
      }
      .faiscas {
        position: absolute;
        width: 44px;
        color: var(--tomate);
        z-index: 2;
      }
      .sol {
        position: absolute;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="moldura"></div>
    <div class="texto">
      <img class="logo" src="../../public/img/marca/webcariri-vinho.png" alt="" />
      <p class="rotulo" id="rotulo"></p>
      <h1 id="titulo"></h1>
      <p class="sub" id="sub"></p>
      <div class="chips" id="chips"></div>
      <p class="rodape" style="margin-top: 28px">
        webcariri.com.br <span class="ponto"></span> Juazeiro do Norte · CE
      </p>
    </div>
    <div class="arte" id="arte"></div>
    <script>
      // Os dados de cada banner chegam pelo hash da URL (JSON), vindos de gerar.mjs.
      const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
      document.getElementById('rotulo').textContent = d.rotulo;
      document.getElementById('titulo').innerHTML = d.titulo;
      document.getElementById('sub').textContent = d.sub || '';
      document.getElementById('chips').innerHTML = (d.chips || []).map((c) => `<span class="chip">${c}</span>`).join('');
      if (d.tituloTamanho) document.getElementById('titulo').style.fontSize = d.tituloTamanho + 'px';
      const faiscas =
        '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M10 26 4 10M26 20l4-16M38 34l16-6"/></svg>';
      let arte = '';
      if (d.tela) {
        arte += `<span class="papel p1"></span><span class="papel p2"></span>
          <figure class="tela" style="--recorte:${d.recorte || 1.5}${d.telaTopo ? ';top:' + d.telaTopo + 'px' : ''}"><img src="../../public/${d.tela}"></figure>`;
      } else {
        arte += `<span class="papel p1" style="top:120px;height:300px"></span><span class="papel p2" style="top:90px"></span>`;
      }
      if (d.sol) arte += `<img class="sol" src="../../public/img/stickers/sol-e-serras-do-cariri.svg" style="${d.sol}">`;
      if (d.cari) arte += `<img class="cari" src="../../public/img/cari/cari-${d.cari.pose}.webp" style="${d.cari.estilo}">`;
      if (d.balao) arte += `<p class="balao" style="${d.balao.estilo}">${d.balao.texto}</p>`;
      // faíscas do lado oposto ao balão, para não cobrir o texto dele
      const faiscasPadrao = d.balao ? 'left:24px;top:46px;transform:rotate(-40deg)' : 'right:40px;top:60px;transform:rotate(20deg)';
      arte += `<span class="faiscas" style="${d.faiscas || faiscasPadrao}">${faiscas}</span>`;
      document.getElementById('arte').innerHTML = arte;
    </script>
  </body>
</html>
